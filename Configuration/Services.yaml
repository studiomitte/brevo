services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    StudioMitte\Brevo\:
        resource: '../Classes/*'
        exclude:
            - '../Classes/Configuration.php'
            - '../Classes/Events/*'

    # EXT:form creates finishers through GeneralUtility::makeInstance(), so the finisher
    # must be public to receive its dependencies and non-shared to get a fresh instance per form.
    StudioMitte\Brevo\Finishers\BrevoFinisher:
        public: true
        shared: false
